<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: отступы под вырез и «полоску» iPhone через safe-area -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Установка на главный экран (PWA). Пути относительные: сайт может
         жить не в корне домена, например на GitHub Pages -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Петергоф" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* Страница целиком не двигается: прокручивается только список внутри.
         Иначе на iPhone у края списка «пружинит» вся страница вместе с
         нижней панелью вкладок. */
      html,
      body {
        position: fixed;
        inset: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Прокрутка списка не передаётся странице */
      #root * {
        overscroll-behavior: contain;
      }
      body {
        /* Цвет фона темы, чтобы при загрузке не мигало белым */
        background: #0b1217;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f2f5f7;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Для работы аудиогида включите JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
